<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 日报 · AI Hot News</title>
    <style>
        /* ============================================================
           报纸风格 · Token 映射（依据 Kimi Design tokens.json, light）
           ============================================================ */
        :root {
            /* 纸面与墨色
               Token Gap：token 无"暖白新闻纸"色（background.primary 为纯白、
               groundPc 偏冷灰），按真实新闻纸质感自定义暖色纸底，已记录 */
            --paper: #f5efdc;                       /* 暖白新闻纸（Token Gap） */
            --paper-tint: #eae2c8;                  /* 封面衬底，同色系加深 */
            --ink: rgba(0, 0, 0, 0.9);              /* labels.primary */
            --ink-secondary: rgba(0, 0, 0, 0.6);    /* labels.secondary */
            --ink-tertiary: rgba(0, 0, 0, 0.45);    /* labels.tertiary */
            --ink-quaternary: rgba(0, 0, 0, 0.3);   /* labels.quaternary */
            --rule: rgba(0, 0, 0, 0.14);            /* separator.s1 报线（暖底下微调） */
            --fill-hover: rgba(0, 0, 0, 0.04);      /* fills.f1（暖底下微调） */
            --fill-active: rgba(0, 0, 0, 0.06);     /* fills.f2（暖底下微调） */
            /* 唯一强调色：报纸金（替换原 kimiBlue），仅用于可交互元素 */
            --accent: #8B6914;                      /* 报纸金 */
            --accent-hover: #735510;
            --accent-active: #5e4408;
            /* 衬线字体（报头/刊名/栏目名，强化报纸质感） */
            --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
            /* 采编状态色：仅监控页 */
            --status-ok: #16c456;                   /* status.positiveGreen */
            --status-bad: #ff3849;                  /* status.danger */
            /* 字体 */
            --font-sans: "PingFang SC", -apple-system, "Helvetica Neue", "Microsoft YaHei", sans-serif;
            --font-mono: "Geist Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
            /* 字阶（typography.webUI / typography.markdown） */
            --t-masthead: 600 20px/30px var(--font-sans);     /* largeTitleEmphasized */
            --t-headline: 400 22px/36px var(--font-sans);     /* h1Content */
            --t-title: 500 16px/24px var(--font-sans);        /* t2Emphasized */
            --t-body: 400 15px/24px var(--font-sans);         /* b2Content */
            --t-label: 400 14px/20px var(--font-sans);        /* b2Regular */
            --t-label-em: 500 14px/20px var(--font-sans);     /* b2Emphasized */
            --t-caption: 400 12px/18px var(--font-sans);      /* c1Regular */
            --t-caption-em: 500 12px/18px var(--font-sans);   /* c1Emphasized */
            /* 间距节奏 32/24/20/16/12/8/4 */
            --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
            /* 圆角 */
            --r-sm: 8px; --r-md: 10px; --r-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font: var(--t-body);
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        /* ============ 报头 Masthead ============ */
        .masthead {
            position: sticky;
            top: 0;
            z-index: 500;
            background: var(--paper);
            border-top: 1px solid var(--rule);
            border-bottom: 3px double var(--ink);   /* 报纸刊头双线 */
        }

        .masthead-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: var(--sp-2) var(--sp-4);
        }

        /* 报眉：日期 · 期号 · 更新时间 */
        .dateline {
            display: flex;
            justify-content: space-between;
            gap: var(--sp-4);
            font: var(--t-caption);
            color: var(--ink-tertiary);
            padding-bottom: var(--sp-2);
        }

        .dateline .mono { font-family: var(--font-mono); }

        .masthead-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--sp-3);
            padding-top: var(--sp-2);
            border-top: 1px solid var(--rule);
        }

        .nameplate {
            font: var(--t-masthead);
            font-family: var(--font-serif);
            color: var(--ink);
            letter-spacing: 0.04em;
        }

        .masthead-right {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            flex-wrap: wrap;
        }

        /* 页导航（资讯看板 / 运行监控） */
        .nav-tabs { display: flex; gap: var(--sp-1); }

        .nav-tab {
            height: 32px;
            padding: 0 var(--sp-3);
            border: none;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--ink-secondary);
            font: var(--t-label-em);
            cursor: pointer;
            transition: background-color 150ms ease, color 150ms ease;
        }

        .nav-tab:hover { background: var(--fill-hover); color: var(--ink); }
        .nav-tab:active { transform: scale(0.97); transition-duration: 100ms; }
        .nav-tab.active { background: var(--fill-active); color: var(--ink); }

        /* 按钮（button.md: primary / outline, size 32） */
        .btn {
            height: 32px;
            padding: 0 var(--sp-3);
            border-radius: var(--r-sm);
            font: var(--t-label-em);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: var(--sp-1);
            transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
        }

        .btn:active { transform: scale(0.97); transition-duration: 100ms; }

        .btn.primary {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: #fff;
        }
        .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn.outline {
            background: transparent;
            border: 1px solid var(--rule);
            color: var(--ink);
        }
        .btn.outline:hover { background: var(--fill-hover); }

        /* ============ 版面容器 ============ */
        .page-container {
            max-width: 960px;
            margin: 0 auto;
            padding: var(--sp-6) var(--sp-4) var(--sp-8);
        }

        .page { display: none; }
        .page.active { display: block; }

        /* ============ 栏目 Tab（下划线式文本 Tab） ============ */
        .section-tabs {
            display: flex;
            align-items: center;
            gap: var(--sp-5);
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid var(--rule);
            margin-bottom: var(--sp-6);
        }
        .section-tabs::-webkit-scrollbar { display: none; }

        .section-tab-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .section-tab {
            padding: var(--sp-2) 0;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            background: transparent;
            color: var(--ink-secondary);
            font: var(--t-label);
            font-family: var(--font-serif);
            cursor: pointer;
            white-space: nowrap;
            transition: color 150ms ease;
        }

        .section-tab:hover { color: var(--ink); }
        .section-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .section-tab .count {
            font: var(--t-caption-em);
            color: var(--ink-tertiary);
            margin-left: var(--sp-1);
        }
        .section-tab.active .count { color: var(--accent); }

        .tab-external-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: var(--r-sm);
            color: var(--ink-quaternary);
            font-size: 12px;
            line-height: 1;
            text-decoration: none;
            transition: background-color 150ms ease, color 150ms ease;
            flex-shrink: 0;
        }
        .tab-external-link:hover {
            background: var(--fill-hover);
            color: var(--ink-secondary);
        }

        /* 元信息图标 */
        .meta-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            vertical-align: -1px;
            margin-right: 2px;
            color: var(--ink-tertiary);
        }
        .meta-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HuggingFace 子标签 */
        .sub-tabs {
            display: none;
            gap: var(--sp-4);
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid var(--rule);
            margin-bottom: var(--sp-6);
            padding-left: var(--sp-4);
        }
        .sub-tabs.visible { display: flex; }
        .sub-tabs::-webkit-scrollbar { display: none; }

        .sub-tab {
            padding: var(--sp-1) 0;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            background: transparent;
            color: var(--ink-tertiary);
            font: var(--t-caption);
            cursor: pointer;
            white-space: nowrap;
            transition: color 150ms ease;
        }
        .sub-tab:hover { color: var(--ink); }
        .sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .sub-tab .count {
            font: var(--t-caption-em);
            color: var(--ink-tertiary);
            margin-left: var(--sp-1);
        }
        .sub-tab.active .count { color: var(--accent); }

        /* ============ 搜索 ============ */
        .search-bar {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            margin-bottom: var(--sp-6);
        }

        .search-input {
            flex: 1;
            height: 36px;
            padding: 0 var(--sp-3);
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            color: var(--ink);
            font: 400 16px/24px var(--font-sans);
            transition: border-color 150ms ease;
        }

        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-input::placeholder { color: var(--ink-quaternary); }

        .total-note {
            font: var(--t-caption);
            color: var(--ink-tertiary);
            white-space: nowrap;
        }

        /* ============ 文章列表：左封面 + 右文字 ============ */
        .article-list { border-top: 1px solid var(--rule); }

        .article {
            display: flex;
            gap: var(--sp-4);
            padding: var(--sp-4) var(--sp-2);
            border-bottom: 1px solid var(--rule);
            border-radius: var(--r-sm);
            transition: background-color 150ms ease;
        }
        .article:hover { background: var(--fill-hover); }
        .article:active { background: var(--fill-active); }

        .article-cover {
            position: relative;
            width: 192px;
            aspect-ratio: 16 / 10;
            border-radius: var(--r-lg);
            overflow: hidden;
            background: var(--paper-tint);
            flex-shrink: 0;
        }
        .article-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .article-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: var(--sp-2);
        }

        .article-title {
            font: var(--t-title);
            color: var(--ink);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article:hover .article-title { color: var(--accent); }

        .article-meta {
            font: var(--t-caption);
            color: var(--ink-tertiary);
        }

        /* 热度排名：元信息行内 mono 前缀 */
        .meta-rank {
            font-family: var(--font-mono);
            color: var(--ink-quaternary);
            margin-right: var(--sp-2);
        }

        /* 跨源报道标识：同一事件被多个来源报道时，在条目下方展示 */
        .cross-source-badge {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            margin-top: 2px;
            font: var(--t-caption);
            color: var(--ink-tertiary);
        }
        .cross-source-badge svg {
            width: 13px;
            height: 13px;
            flex: none;
            color: var(--accent);
        }

        /* ============ 空态 / 加载态 ============ */
        .state-note {
            text-align: center;
            padding: var(--sp-8) var(--sp-4);
            font: 400 15px/22px var(--font-sans);
            color: var(--ink-tertiary);
        }

        /* 来源抓取暂不可用提示（如 BestBlogs 接口异常） */
        .state-note.warn {
            color: #a33;
            background: #fdf3f2;
            border: 1px solid #f0c9c4;
            border-radius: 2px;
            text-align: left;
            padding: var(--sp-4);
        }

        .state-note .btn { margin-top: var(--sp-3); }

        /* ============ 运行监控页 ·「印刷房」 ============ */
        .press-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: var(--sp-8);
            border-top: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
        }

        .press-stat {
            padding: var(--sp-4) var(--sp-3);
            text-align: center;
        }
        .press-stat + .press-stat { border-left: 1px solid var(--rule); }

        .press-stat-value {
            font: 400 20px/32px var(--font-mono);
            color: var(--ink);
        }
        .press-stat-value.ok { color: var(--status-ok); }
        .press-stat-value.bad { color: var(--status-bad); }

        .press-stat-label {
            font: var(--t-label);
            color: var(--ink-secondary);
        }

        .press-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sp-8);
        }

        .press-section-title {
            font: var(--t-label-em);
            font-family: var(--font-serif);
            color: var(--ink);
            padding-bottom: var(--sp-2);
            border-bottom: 1px solid var(--rule);
            margin-bottom: var(--sp-2);
        }

        /* 平台状态：表格化列表 */
        .status-row {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-3) var(--sp-2);
            border-bottom: 1px solid var(--rule);
            border-radius: var(--r-sm);
            transition: background-color 150ms ease;
        }
        .status-row:hover { background: var(--fill-hover); }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.online { background: var(--status-ok); }
        .status-dot.error { background: var(--status-bad); }

        .status-name { font: var(--t-label-em); color: var(--ink); flex: 1; }
        .status-meta { font: var(--t-caption); color: var(--ink-tertiary); }

        /* 采集记录 */
        .record-row {
            display: flex;
            gap: var(--sp-3);
            padding: var(--sp-3) var(--sp-2);
            border-bottom: 1px solid var(--rule);
            border-radius: var(--r-sm);
            transition: background-color 150ms ease;
        }
        .record-row:hover { background: var(--fill-hover); }

        .record-mark {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font: var(--t-caption-em);
            flex-shrink: 0;
            margin-top: 1px;
        }
        .record-row.success .record-mark { background: rgba(22, 196, 86, 0.1); color: var(--status-ok); }
        .record-row.error .record-mark { background: rgba(255, 56, 73, 0.1); color: var(--status-bad); }

        .record-body { flex: 1; min-width: 0; }
        .record-title { font: var(--t-label-em); color: var(--ink); margin-bottom: var(--sp-1); }
        .record-meta { font: var(--t-caption); color: var(--ink-tertiary); }
        .record-meta .err { color: var(--status-bad); }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .article { flex-direction: column; }
            .article-cover { width: 100%; aspect-ratio: 16 / 9; }
            .press-stats { grid-template-columns: 1fr 1fr; }
            .press-stat:nth-child(3) { border-left: none; }
            .press-stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
            .press-grid { grid-template-columns: 1fr; }
            .masthead-main { gap: var(--sp-2); }
            .search-bar { flex-direction: column; align-items: stretch; }
            .total-note { text-align: right; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============ 订阅按钮（报纸金描边，hover 填充） ============ */
        .btn.subscribe {
            background: var(--paper);
            border: 1.5px solid var(--accent);
            color: var(--accent);
        }
        .btn.subscribe:hover { background: var(--accent); color: #fff; }
        .btn.subscribe svg { width: 16px; height: 16px; }

        /* ============ 订阅弹窗 ============ */
        .overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(26, 26, 26, .42);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .modal {
            background: #fff; width: 100%; max-width: 420px;
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
            border: 1px solid var(--rule);
        }
        .modal-head {
            background: var(--paper-tint);
            padding: 16px 20px; border-bottom: 2px solid var(--rule);
        }
        .modal-head h3 { margin: 0; font-family: var(--font-serif); font-size: 18px; color: var(--ink); }
        .modal-head p { margin: 4px 0 0; font-size: 12px; color: var(--ink-secondary); }
        .modal-body { padding: 20px; }
        .field label { display: block; font-size: 13px; color: var(--ink-secondary); margin-bottom: 6px; font-weight: 600; }
        .field input {
            width: 100%; padding: 11px 12px; font-size: 15px;
            border: 1.5px solid var(--rule); border-radius: 5px; outline: none;
            background: var(--paper); color: var(--ink);
        }
        .field input:focus { border-color: var(--accent); }
        .hint { font-size: 11.5px; color: var(--ink-tertiary); margin-top: 7px; line-height: 1.6; }
        .warn {
            font-size: 11.5px; color: #9a6b00; background: #fdf6e3;
            border: 1px solid #ecd9a0; border-radius: 5px; padding: 8px 10px;
            margin-top: 10px; line-height: 1.6;
        }
        .actions { display: flex; gap: 10px; margin-top: 18px; }
        .btn.sub-primary {
            flex: 1; padding: 11px; border-radius: 5px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: #fff;
        }
        .btn.sub-primary:hover { background: var(--accent-hover); }
        .btn.sub-secondary {
            flex: 1; padding: 11px; border-radius: 5px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1.5px solid var(--rule); background: #fff; color: var(--ink-secondary);
        }
        .btn.sub-secondary:hover { border-color: var(--accent); color: var(--accent); }
        .msg { margin-top: 14px; font-size: 13px; line-height: 1.6; padding: 10px 12px; border-radius: 5px; display: none; }
        .msg.ok { display: block; background: #eef7ee; border: 1px solid #bfe0bf; color: #2e7d32; }
        .msg.warn2 { display: block; background: #fdf6e3; border: 1px solid #ecd9a0; color: #9a6b00; }
        .msg.err { display: block; background: #fdeeee; border: 1px solid #f0c4c4; color: #b3261e; }

        /* Toast：悬浮提示，比内联 msg 更醒目 */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 9999; min-width: 280px; max-width: 480px;
            padding: 12px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 500; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.18);
            opacity: 0; transition: opacity .25s ease, transform .25s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.ok { background: #2e7d32; color: #fff; }
        .toast.warn { background: #9a6b00; color: #fff; }
        .toast.err { background: #b3261e; color: #fff; }
        .modal-foot { display: flex; justify-content: flex-end; padding: 0 20px 16px; }
        .link-btn { background: none; border: none; color: var(--ink-secondary); font-size: 12px; cursor: pointer; text-decoration: underline; }

        @media (max-width: 768px) { .modal { max-width: 100%; } }
    </style>
</head>
<body>
    <!-- 报头 -->
    <header class="masthead">
        <div class="masthead-inner">
            <div class="dateline">
                <span id="datelineLeft">— 年 — 月 — 日 · 第 — 期</span>
                <span class="mono" id="lastUpdate">更新于 --:--</span>
            </div>
            <div class="masthead-main">
                <div class="nameplate">AI 日报</div>
                <div class="masthead-right">
                    <nav class="nav-tabs" aria-label="页面导航">
                        <button class="nav-tab active" data-page="news">资讯看板</button>
                        <button class="nav-tab" data-page="monitor">运行监控</button>
                    </nav>
                    <button class="btn outline" id="exportBtn">导出 JSON</button>
                    <button class="btn subscribe" id="subscribeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        订阅
                    </button>
                    <button class="btn primary" id="refreshBtn">刷新</button>
                </div>
            </div>
        </div>
    </header>

    <main class="page-container">
        <!-- 资讯看板 -->
        <div class="page active" id="news-page">
            <nav class="section-tabs" id="platformTabs" aria-label="平台栏目">
                <button class="section-tab active" data-platform="all">头版<span class="count">0</span></button>
                <div class="section-tab-wrapper">
                    <button class="section-tab" data-platform="radarai">RadarAI<span class="count">0</span></button>
                    <a class="tab-external-link" href="https://radarai.top/updates/" target="_blank" rel="noopener" title="访问 RadarAI 官网">🔗</a>
                </div>
                <div class="section-tab-wrapper">
                    <button class="section-tab" data-platform="bestblogs">BestBlogs<span class="count">0</span></button>
                    <a class="tab-external-link" href="https://www.bestblogs.dev/reading/brief" target="_blank" rel="noopener" title="访问 BestBlogs 官网">🔗</a>
                </div>
                <div class="section-tab-wrapper">
                    <button class="section-tab" data-platform="hackernews">Hacker News<span class="count">0</span></button>
                    <a class="tab-external-link" href="https://news.ycombinator.com/" target="_blank" rel="noopener" title="访问 Hacker News 官网">🔗</a>
                </div>
                <div class="section-tab-wrapper">
                    <button class="section-tab" data-platform="qbitai">量子位<span class="count">0</span></button>
                    <a class="tab-external-link" href="https://www.qbitai.com/" target="_blank" rel="noopener" title="访问量子位官网">🔗</a>
                </div>
                <div class="section-tab-wrapper">
                    <button class="section-tab" data-platform="huggingface">HuggingFace<span class="count">0</span></button>
                    <a class="tab-external-link" href="https://huggingface.co/" target="_blank" rel="noopener" title="访问 HuggingFace 官网">🔗</a>
                </div>
            </nav>

            <nav class="sub-tabs" id="huggingfaceSubTabs" aria-label="HuggingFace 子栏目">
                <button class="sub-tab active" data-hf-tab="all">全部<span class="count">0</span></button>
                <button class="sub-tab" data-hf-tab="papers">论文<span class="count">0</span></button>
                <button class="sub-tab" data-hf-tab="models">模型<span class="count">0</span></button>
            </nav>

            <nav class="sub-tabs" id="bestblogsSubTabs" aria-label="BestBlogs 子栏目">
                <button class="sub-tab active" data-bb-tab="all">全部<span class="count">0</span></button>
                <button class="sub-tab" data-bb-tab="brief">早报<span class="count">0</span></button>
                <button class="sub-tab" data-bb-tab="featured">精选<span class="count">0</span></button>
            </nav>

            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索文章标题…" aria-label="搜索文章标题">
                <span class="total-note" id="totalBadge">共 0 篇</span>
            </div>

            <div id="newsContent">
                <div class="state-note">加载数据中…</div>
            </div>
        </div>

        <!-- 运行监控 -->
        <div class="page" id="monitor-page">
            <div class="press-stats" id="metricCards">
                <div class="press-stat"><div class="press-stat-value ok">--</div><div class="press-stat-label">采集成功率</div></div>
                <div class="press-stat"><div class="press-stat-value bad">--</div><div class="press-stat-label">失败率</div></div>
                <div class="press-stat"><div class="press-stat-value">--</div><div class="press-stat-label">平均响应时间</div></div>
                <div class="press-stat"><div class="press-stat-value ok">--</div><div class="press-stat-label">封面获取率</div></div>
            </div>

            <div class="press-grid">
                <section>
                    <h3 class="press-section-title">平台状态</h3>
                    <div id="platformStatus"></div>
                </section>
                <section>
                    <h3 class="press-section-title">最近采集记录</h3>
                    <div id="recentExecutions"></div>
                </section>
            </div>
        </div>
    </main>

    <!-- 订阅弹窗 -->
    <div class="overlay" id="subOverlay" style="display:none">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="subTitle">
            <div class="modal-head">
                <h3 id="subTitle">订阅 AINews 每日速报</h3>
                <p>每天早上 9:00 左右自动推送，免费</p>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label for="subEmail">邮箱地址</label>
                    <input id="subEmail" type="email" placeholder="如 name@gmail.com / name@qq.com" autocomplete="email">
                    <div class="hint">Resend 支持：Gmail · Outlook · QQ · 163 · 企业邮 等主流邮箱</div>
                    <div class="warn">⚠ 国内邮箱（QQ / 163 等）送达率可能受影响，建议优先使用 Gmail / Outlook。</div>
                </div>
                <div class="actions">
                    <button class="btn sub-primary" id="subBtn">订阅</button>
                    <button class="btn sub-secondary" id="unsubBtn">退订</button>
                </div>
                <div class="msg" id="subMsg"></div>
            </div>
            <div class="modal-foot">
                <button class="link-btn" id="subClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 全局 Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let appData = null;
        let currentPlatform = 'all';
        let huggingfaceSubTab = 'all';
        let searchKeyword = '';

        const platformNames = {
            'hackernews': 'Hacker News',
            'qbitai': '量子位',
            'radarai': 'RadarAI',
            'bestblogs': 'BestBlogs',
            'huggingface': 'HuggingFace'
        };

        const subTabState = {
            huggingface: 'all',
            bestblogs: 'all'
        };

        async function loadData() {
            try {
                const response = await fetch('data/news.json?' + Date.now());
                if (!response.ok) throw new Error('Failed to load data');
                appData = await response.json();
                renderAll();
            } catch (e) {
                console.error('Error loading data:', e);
                document.getElementById('newsContent').innerHTML =
                    '<div class="state-note">数据加载失败，请确保已运行爬虫并生成 data/news.json' +
                    '<br><button class="btn outline" onclick="loadData()">重试</button></div>';
            }
        }

        function renderAll() {
            if (!appData) return;
            renderDateline();
            renderPlatformCounts();
            renderTotalCount();
            renderFrontPage();
            renderMonitorDashboard();
        }

        // 报眉：日期 + 期号（以当年第几天作为期号）+ 更新时间
        function renderDateline() {
            if (!appData.update_time) return;
            const d = new Date(appData.update_time);
            const start = new Date(d.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((d - start) / 86400000);
            const dateStr = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            document.getElementById('datelineLeft').textContent = dateStr + ' · 第 ' + dayOfYear + ' 期';
            document.getElementById('lastUpdate').textContent =
                '更新于 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderTotalCount() {
            const news = appData.news || {};
            let total = 0;
            Object.values(news).forEach(function(arr) { total += (arr ? arr.length : 0); });
            document.getElementById('totalBadge').textContent = '共 ' + total + ' 篇';
        }

        function renderPlatformCounts() {
            const tabs = document.querySelectorAll('.section-tab');
            const news = appData.news || {};
            tabs.forEach(function(tab) {
                const platform = tab.dataset.platform;
                let count = 0;
                if (platform === 'all') {
                    // 与头版(sorted_all，已跨源去重)保持一致
                    count = (appData.sorted_all || []).length;
                } else {
                    count = (news[platform] || []).length;
                }
                const countEl = tab.querySelector('.count');
                if (countEl) countEl.textContent = count;
            });

            // HuggingFace 子标签计数
            const hfArticles = news['huggingface'] || [];
            const hfSubTabCounts = {
                all: hfArticles.length,
                papers: hfArticles.filter(function(a) { return (a.tags || []).indexOf('论文') !== -1; }).length,
                models: hfArticles.filter(function(a) { return (a.tags || []).indexOf('模型') !== -1; }).length
            };
            document.querySelectorAll('#huggingfaceSubTabs .sub-tab').forEach(function(tab) {
                const key = tab.dataset.hfTab;
                const countEl = tab.querySelector('.count');
                if (countEl) countEl.textContent = hfSubTabCounts[key] || 0;
            });

            // BestBlogs 子标签计数
            const bbArticles = news['bestblogs'] || [];
            const bbSubTabCounts = {
                all: bbArticles.length,
                brief: bbArticles.filter(function(a) { return (a.tags || []).indexOf('早报') !== -1; }).length,
                featured: bbArticles.filter(function(a) { return (a.tags || []).indexOf('精选') !== -1; }).length
            };
            document.querySelectorAll('#bestblogsSubTabs .sub-tab').forEach(function(tab) {
                const key = tab.dataset.bbTab;
                const countEl = tab.querySelector('.count');
                if (countEl) countEl.textContent = bbSubTabCounts[key] || 0;
            });
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // 元信息行：来源 · 时间 · 热度 · 平台数据
        function buildMeta(item) {
            var parts = [];
            var platform = item.platform || currentPlatform;
            parts.push(platformNames[platform] || platform);

            // HuggingFace 论文/模型类型标记
            if (platform === 'huggingface') {
                var tags = item.tags || [];
                if (tags.indexOf('论文') !== -1) parts.push('论文');
                else if (tags.indexOf('模型') !== -1) parts.push('模型');
            }

            // BestBlogs 早报/精选类型标记
            if (platform === 'bestblogs') {
                var tags = item.tags || [];
                if (tags.indexOf('早报') !== -1) parts.push('早报');
                else if (tags.indexOf('精选') !== -1) parts.push('精选');
            }

            if (item.publish_time) {
                try {
                    parts.push(new Date(item.publish_time).toLocaleString('zh-CN',
                        { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
                } catch (e) { parts.push(item.publish_time); }
            }

            // score：BestBlogs 质量分不外显；其他平台用 SVG icon 替代通用 ↑
            if (item.score && platform !== 'bestblogs') {
                var scoreIcon = '<span class="meta-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>';
                parts.push(scoreIcon + item.score);
            }

            if (item.comments_count) {
                var commentIcon = '<span class="meta-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>';
                parts.push(commentIcon + item.comments_count);
            }
            return parts.join(' · ');
        }

        function safeUrl(item) {
            var url = item.platform_url || item.url || '#';
            return url.replace(/"/g, '&quot;');
        }

        function matchesHfSubTab(item) {
            if (subTabState.huggingface === 'all') return true;
            const tags = item.tags || [];
            if (subTabState.huggingface === 'papers') return tags.indexOf('论文') !== -1;
            if (subTabState.huggingface === 'models') return tags.indexOf('模型') !== -1;
            return true;
        }

        function matchesBestblogsSubTab(item) {
            if (subTabState.bestblogs === 'all') return true;
            const tags = item.tags || [];
            if (subTabState.bestblogs === 'brief') return tags.indexOf('早报') !== -1;
            if (subTabState.bestblogs === 'featured') return tags.indexOf('精选') !== -1;
            return true;
        }

        // 文章列表：左封面 + 右文字（所有栏目统一结构）
        function renderFrontPage() {
            const container = document.getElementById('newsContent');
            const sortedAll = appData.sorted_all || [];

            // 头版(all)用聚类去重后的 sorted_all；各平台分栏直接用原始 news[platform]，
            // 避免被并入其他平台代表条目的文章从本平台分栏消失。
            let items;
            if (currentPlatform === 'all') {
                items = sortedAll.slice();
            } else {
                items = (appData.news[currentPlatform] || []).slice();
            }

            if (currentPlatform === 'huggingface') {
                items = items.filter(matchesHfSubTab);
            }

            if (currentPlatform === 'bestblogs') {
                items = items.filter(matchesBestblogsSubTab);
            }

            if (searchKeyword) {
                const kw = searchKeyword.toLowerCase();
                items = items.filter(function(it) { return it.title.toLowerCase().includes(kw); });
            }

            const isUnavailable = appData.platform_unavailable &&
                appData.platform_unavailable.indexOf(currentPlatform) !== -1;

            if (items.length === 0) {
                if (isUnavailable) {
                    const pname = platformNames[currentPlatform] || currentPlatform;
                    container.innerHTML = '<div class="state-note warn">⚠️ ' + pname +
                        ' 抓取暂不可用，本期不含该来源内容。</div>';
                } else {
                    container.innerHTML = '<div class="state-note">本版暂无内容</div>';
                }
                return;
            }

            var html = '<div class="article-list">';
            items.forEach(function(item, i) {
                var rank = String(i + 1).padStart(2, '0');

                html += '<a class="article" href="' + safeUrl(item) + '" target="_blank" rel="noopener">';

                // 仅有封面图时才渲染封面位；无图文章文字通栏
                if (item.cover_url) {
                    html += '<div class="article-cover">' +
                            '<img src="' + item.cover_url.replace(/"/g, '&quot;') +
                            '" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>';
                }

                html += '<div class="article-body">' +
                        '<div class="article-title">' + escapeHtml(item.title || '无标题') + '</div>' +
                        '<div class="article-meta"><span class="meta-rank">' + rank + '</span>' +
                        buildMeta(item) + '</div>';

                // 跨源报道标识：同一事件被多个来源报道时，在条目下方展示其他来源
                // （外层条目本身是 <a>，为避免嵌套 <a>，这里用纯文字列出其他来源名）
                if (item.also_covered_by && item.also_covered_by.length) {
                    var others = item.also_covered_by;
                    var names = others.map(function(o) {
                        return platformNames[o.platform] || o.platform || '未知';
                    });
                    html += '<div class="cross-source-badge">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' +
                            '同时被 ' + others.length + ' 个来源报道：' + escapeHtml(names.join('、')) +
                            '</div>';
                }

                html += '</div></a>';
            });
            html += '</div>';

            container.innerHTML = html;
        }

        function renderMonitorDashboard() {
            const monitor = appData.monitor || {};
            const summary = monitor.summary || {};

            document.getElementById('metricCards').innerHTML =
                '<div class="press-stat"><div class="press-stat-value ok">' + (summary.total_success_rate || 0) + '%</div><div class="press-stat-label">采集成功率</div></div>' +
                '<div class="press-stat"><div class="press-stat-value bad">' + (summary.total_fail_rate || 0) + '%</div><div class="press-stat-label">失败率</div></div>' +
                '<div class="press-stat"><div class="press-stat-value">' + (summary.avg_response_time || 0) + 's</div><div class="press-stat-label">平均响应时间</div></div>' +
                '<div class="press-stat"><div class="press-stat-value ok">' + (summary.cover_success_rate || 0) + '%</div><div class="press-stat-label">封面获取率</div></div>';

            const platforms = monitor.platforms || [];
            let platformHtml = '';
            platforms.forEach(function(p) {
                const statusText = p.status === 'online' ? '正常' : '异常';
                platformHtml += '<div class="status-row">' +
                    '<span class="status-dot ' + p.status + '"></span>' +
                    '<span class="status-name">' + (p.name || p.platform) + '</span>' +
                    '<span class="status-meta">' + statusText + ' · ' + (p.item_count || 0) + ' 条</span>' +
                    '</div>';
            });
            document.getElementById('platformStatus').innerHTML =
                platformHtml || '<div class="state-note">暂无平台数据</div>';

            const executions = monitor.recent_executions || [];
            let execHtml = '';
            executions.forEach(function(exec) {
                const ok = exec.status === 'success';
                const title = (platformNames[exec.platform] || exec.platform) + ' 采集';
                const time = new Date(exec.timestamp).toLocaleString('zh-CN');
                const detail = ok
                    ? '成功获取 ' + (exec.items_collected || 0) + ' 条 · 耗时 ' + (exec.latency || 0) + 's'
                    : '<span class="err">失败：' + escapeHtml(exec.error_message || '未知错误') + '</span>';
                execHtml += '<div class="record-row ' + exec.status + '">' +
                    '<span class="record-mark">' + (ok ? '✓' : '✕') + '</span>' +
                    '<div class="record-body">' +
                    '<div class="record-title">' + title + '</div>' +
                    '<div class="record-meta">' + time + ' · ' + detail + '</div>' +
                    '</div></div>';
            });
            document.getElementById('recentExecutions').innerHTML =
                execHtml || '<div class="state-note">暂无记录</div>';
        }

        document.querySelectorAll('.nav-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById(tab.dataset.page + '-page').classList.add('active');
            });
        });

        document.querySelectorAll('.section-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.section-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                currentPlatform = tab.dataset.platform;

                // 子标签显隐与重置
                const hfSubTabs = document.getElementById('huggingfaceSubTabs');
                const bbSubTabs = document.getElementById('bestblogsSubTabs');

                if (currentPlatform === 'huggingface') {
                    hfSubTabs.classList.add('visible');
                } else {
                    hfSubTabs.classList.remove('visible');
                    subTabState.huggingface = 'all';
                    document.querySelectorAll('#huggingfaceSubTabs .sub-tab').forEach(function(t) { t.classList.remove('active'); });
                    document.querySelector('#huggingfaceSubTabs .sub-tab[data-hf-tab="all"]').classList.add('active');
                }

                if (currentPlatform === 'bestblogs') {
                    bbSubTabs.classList.add('visible');
                } else {
                    bbSubTabs.classList.remove('visible');
                    subTabState.bestblogs = 'all';
                    document.querySelectorAll('#bestblogsSubTabs .sub-tab').forEach(function(t) { t.classList.remove('active'); });
                    document.querySelector('#bestblogsSubTabs .sub-tab[data-bb-tab="all"]').classList.add('active');
                }
                renderFrontPage();
            });
        });

        document.querySelectorAll('.sub-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                // 只切换同组子标签，避免跨组干扰
                const parent = tab.parentElement;
                if (!parent) return;
                parent.querySelectorAll('.sub-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');

                if (tab.dataset.hfTab) {
                    subTabState.huggingface = tab.dataset.hfTab;
                } else if (tab.dataset.bbTab) {
                    subTabState.bestblogs = tab.dataset.bbTab;
                }
                renderFrontPage();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchKeyword = e.target.value.trim();
            if (appData) renderFrontPage();
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadData();
        });

        document.getElementById('exportBtn').addEventListener('click', function() {
            if (!appData) return;
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ai-news_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        /* ============ 订阅功能（Cloudflare Worker 直连） ============ */
        const SUB_WORKER_URL = 'https://ainews.spidernews.workers.dev';

        /* ---- Toast（全局悬浮提示） ---- */
        let toastTimer = null;
        function showToast(type, text, duration) {
            duration = duration || 3500;
            var el = document.getElementById('toast');
            el.className = 'toast ' + type; el.textContent = text;
            // 强制 reflow 以重置动画
            void el.offsetWidth;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.classList.remove('show'); }, duration);
        }

        function openSubModal() {
            document.getElementById('subOverlay').style.display = 'flex';
            document.getElementById('subEmail').focus();
        }
        function closeSubModal() {
            document.getElementById('subOverlay').style.display = 'none';
            clearSubMsg();
        }
        function clearSubMsg() {
            const m = document.getElementById('subMsg');
            m.className = 'msg'; m.textContent = '';
        }
        function showSubMsg(type, text) {
            const m = document.getElementById('subMsg');
            m.className = 'msg ' + type; m.textContent = text;
        }
        function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

        function workerConfigured() {
            return SUB_WORKER_URL && SUB_WORKER_URL.indexOf('spidernews') !== -1;
        }

        /**
         * 调用 Worker：/subscribe 或 /unsubscribe
         * 返回 { ok, code, message } —— 任何异常路径都保证返回此结构，不会抛出。
         */
        async function subRequest(action, email) {
            try {
                var resp = await fetch(SUB_WORKER_URL + '/' + action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                // 网络层成功但 HTTP 状态码异常
                if (!resp.ok && resp.status !== 409) {
                    // 5xx 服务端错误
                    if (resp.status >= 500) {
                        return { ok: false, code: 'server_error', message: '服务暂时不可用，请稍后重试（HTTP ' + resp.status + ')' };
                    }
                    // 4xx 客户端错误（非 409）
                    if (resp.status >= 400) {
                        try {
                            var errBody = await resp.json();
                            return { ok: false, code: errBody.code || 'client_error', message: errBody.message || ('请求失败（HTTP ' + resp.status + ')' };
                        } catch (_) {
                            return { ok: false, code: 'client_error', message: '请求失败（HTTP ' + resp.status + '），请检查输入后重试' };
                        }
                    }
                }

                // 正常响应 或 409（已订阅/未订阅的业务冲突）
                try {
                    return await resp.json();
                } catch (e) {
                    return { ok: false, code: 'error', message: '服务返回了无效数据，请稍后重试' };
                }
            } catch (e) {
                // fetch 本身抛出：网络断开 / 超时 / CORS / DNS 解析失败
                var msg = e.message || String(e);
                if (msg.indexOf('Failed to fetch') !== -1 || msg.indexOf('NetworkError') !== -1 || msg.indexOf('fetch failed') !== -1) {
                    return { ok: false, code: 'network_error', message: '网络连接失败，请检查网络后重试' };
                }
                if (msg.indexOf('timed out') !== -1 || msg.indexOf('Timeout') !== -1 || msg.indexOf('TIMEOUT') !== -1) {
                    return { ok: false, code: 'timeout', message: '请求超时，服务器响应较慢，请稍后重试' };
                }
                if (msg.indexOf('CORS') !== -1 || msg.indexOf('cross-origin') !== -1) {
                    return { ok: false, code: 'cors_error', message: '跨域请求被拒绝，请联系站长检查 Worker 配置' };
                }
                return { ok: false, code: 'error', message: '请求异常：' + msg.slice(0, 80) };
            }
        }

        async function subSubscribe() {
            var btn = document.getElementById('subBtn');
            var e = (document.getElementById('subEmail').value || '').trim().toLowerCase();
            if (!validEmail(e)) { showSubMsg('err', '请输入有效的邮箱地址'); showToast('err', '请输入有效的邮箱地址'); return; }
            if (!workerConfigured()) { showSubMsg('err', '订阅服务未配置（请联系站长设置 Worker 地址）'); showToast('err', '订阅服务暂不可用'); return; }

            btn.disabled = true; btn.textContent = '提交中…';
            clearSubMsg();

            try {
                var data = await subRequest('subscribe', e);
                if (data.code === 'already_subscribed') {
                    showSubMsg('warn2', '该邮箱已订阅，无需重复订阅');
                    showToast('warn', '该邮箱已订阅，无需重复订阅 ✉️');
                } else if (data.ok) {
                    showSubMsg('ok', data.message || ('订阅成功！每日早报将发送至 ' + e));
                    showToast('ok', '订阅成功！每日早报将发送至 ' + e + ' 🎉');
                } else {
                    showSubMsg('err', data.message || '订阅失败，请稍后重试');
                    showToast('err', data.message || '订阅失败，请稍后重试');
                }
            } catch (unexpectedErr) {
                // 兜底：理论上 subRequest 已吞掉所有异常，此处仅防遗漏
                var errMsg = unexpectedErr.message || String(unexpectedErr);
                showSubMsg('err', '发生未知错误：' + errMsg.slice(0, 60));
                showToast('err', '订阅请求异常，请稍后重试');
            } finally {
                btn.disabled = false; btn.textContent = '订阅';
            }
        }

        async function subUnsubscribe() {
            var btn = document.getElementById('unsubBtn');
            var e = (document.getElementById('subEmail').value || '').trim().toLowerCase();
            if (!validEmail(e)) { showSubMsg('err', '请输入有效的邮箱地址'); showToast('err', '请输入有效的邮箱地址'); return; }
            if (!workerConfigured()) { showSubMsg('err', '订阅服务未配置（请联系站长设置 Worker 地址）'); showToast('err', '订阅服务暂不可用'); return; }

            btn.disabled = true; btn.textContent = '提交中…';
            clearSubMsg();

            try {
                var data = await subRequest('unsubscribe', e);
                if (data.code === 'not_subscribed') {
                    showSubMsg('warn2', '该邮箱尚未订阅，无需退订');
                    showToast('warn', '该邮箱尚未订阅，无需退订');
                } else if (data.ok) {
                    showSubMsg('ok', data.message || ('已退订，后续将不再向 ' + e + ' 发送邮件'));
                    showToast('ok', '已成功退订 👋');
                } else {
                    showSubMsg('err', data.message || '退订失败，请稍后重试');
                    showToast('err', data.message || '退订失败，请稍后重试');
                }
            } catch (unexpectedErr) {
                var errMsg = unexpectedErr.message || String(unexpectedErr);
                showSubMsg('err', '发生未知错误：' + errMsg.slice(0, 60));
                showToast('err', '退订请求异常，请稍后重试');
            } finally {
                btn.disabled = false; btn.textContent = '退订';
            }
        }

        document.getElementById('subscribeBtn').addEventListener('click', openSubModal);
        document.getElementById('subClose').addEventListener('click', closeSubModal);
        document.getElementById('subBtn').addEventListener('click', subSubscribe);
        document.getElementById('unsubBtn').addEventListener('click', subUnsubscribe);
        document.getElementById('subOverlay').addEventListener('click', function(ev) {
            if (ev.target === this) closeSubModal();
        });
        document.addEventListener('keydown', function(ev) {
            if (ev.key === 'Escape' && document.getElementById('subOverlay').style.display === 'flex') closeSubModal();
        });

        loadData();
    </script>
</body>
</html>
