name: Keepalive

# 防止 GitHub 因仓库 60 天无活动而自动禁用 crawl-news 的定时任务。
# 每月 1 号执行一次轻量提交，维持仓库活跃度；纯 GitHub Actions，无外部依赖。
on:
  schedule:
    - cron: '17 3 1 * *'   # 每月 1 号 UTC 03:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Touch keepalive marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          echo "last-keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive
          git add .github/keepalive
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keepalive"
            git push
          fi
